name: Skill proposal
description: Propose a new skill or a significant change, before writing it.
labels: [enhancement]
body:
  - type: input
    id: name
    attributes:
      label: Proposed skill name
      placeholder: spec-review
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong today without this skill?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Intended behavior
      description: When should it trigger, and what should the agent do differently?
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Fit
      description: How it relates to the existing skills, and whether it works in any repo and any agent.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open the pull request
